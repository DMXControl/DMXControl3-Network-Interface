name: Release PyPI package
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing
    defaults:
      run:
        working-directory: python/dmxc_protobuf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build
        run: |
          pip install poetry
          poetry install
          poetry run ./build.sh
          poetry run python -m unittest discover -s tests -t .
          poetry version "${GITHUB_REF_NAME#v}"
          poetry build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dmxc_protobuf/dist
          skip-existing: true
