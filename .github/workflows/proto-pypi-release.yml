name: Release PyPI package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish: 3.3.3, 3.3.3-rc.0, or 3.3.3.1 for a dependency-only fix (builds the selected branch or tag)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing
    defaults:
      run:
        working-directory: python/dmxc_protobuf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Determine version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release-version.sh" pypi

      - name: Build
        run: |
          pip install poetry
          poetry install
          poetry run ./build.sh
          poetry run python -m unittest discover -s tests -t .
          poetry version "$VERSION"
          poetry build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dmxc_protobuf/dist
          skip-existing: true
