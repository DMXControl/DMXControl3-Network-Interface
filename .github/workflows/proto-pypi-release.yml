name: Release PyPI package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 3.3.3 (builds the selected branch or tag)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing
    defaults:
      run:
        working-directory: python/dmxc_protobuf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Determine version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          V="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$V'"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build
        run: |
          pip install poetry
          poetry install
          poetry run ./build.sh
          poetry run python -m unittest discover -s tests -t .
          poetry version "$VERSION"
          poetry build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dmxc_protobuf/dist
          skip-existing: true
