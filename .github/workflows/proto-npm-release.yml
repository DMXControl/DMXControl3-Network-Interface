name: Release NPM package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish: 3.3.3, 3.3.3-rc.0, or 3.3.3.1 for a dependency-only fix (builds the selected branch or tag)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      # npm (Node, @grpc/grpc-js) and npm-web (gRPC-Web, nice-grpc-web) are published with the same version;
      # a failure in one package must not cancel the other mid-publish (re-run the workflow to retry it,
      # the already published package is skipped)
      fail-fast: false
      matrix:
        package: [npm, npm-web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: 'https://registry.npmjs.org'

      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release-version.sh" npm

      # skip packages that already have this version, e.g. when a newly added package is
      # published for an existing release, or when re-running after one package failed
      - name: Check if already published
        if: env.SKIP_PUBLISH != 'true'
        run: |
          name=$(node -p 'require("./package.json").name')
          if published=$(npm view "$name@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err"); then
            if [[ -n "$published" ]]; then
              echo "::notice::$name@$VERSION is already published, skipping"
              echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            # E404 means the package does not exist yet; anything else is a real error
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi

      - name: Build
        if: env.SKIP_PUBLISH != 'true'
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          npm run build
          npm test

      # authenticates via OIDC (id-token: write) using the trusted publisher
      # configured on npmjs.com — no NPM_TOKEN secret needed
      - name: Publish
        if: env.SKIP_PUBLISH != 'true'
        # pre-releases (e.g. 3.3.4-rc.1) go to the "next" dist-tag, so they are not installed by default
        run: |
          TAG=latest
          [[ "$VERSION" == *-* ]] && TAG=next
          npm publish --provenance --tag "$TAG" ${RUNNER_DEBUG:+--loglevel verbose}
