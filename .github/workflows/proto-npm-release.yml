name: Release NPM package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 3.3.3 (builds the selected branch or tag)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: 'https://registry.npmjs.org'

      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          V="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$V'"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build
        run: |
          npm ci
          npm version --no-git-tag-version "$VERSION"
          npm run build
          npm test

      # authenticates via OIDC (id-token: write) using the trusted publisher
      # configured on npmjs.com — no NPM_TOKEN secret needed
      - name: Publish
        run: npm publish --provenance ${RUNNER_DEBUG:+--loglevel verbose}
